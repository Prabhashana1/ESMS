<!-- src/app/layout/shell/shell.component.html -->
<div class="relative flex h-screen bg-gray-50 font-sans text-gray-800 overflow-hidden">
  
  <!-- Hidden checkbox for pure Tailwind mobile sidebar toggle (Must be a direct sibling to aside) -->
  <input type="checkbox" id="sidebar-toggle" class="hidden peer" />

  <!-- Mobile Backdrop Overlay -->
  <label for="sidebar-toggle" class="fixed inset-0 bg-gray-900/40 backdrop-blur-xs z-40 hidden peer-checked:block md:hidden transition-opacity cursor-pointer"></label>
  
  <!-- ================= SIDEBAR ================= -->
  <aside class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-gray-200 flex flex-col justify-between transform -translate-x-full transition-transform duration-300 ease-in-out peer-checked:translate-x-0 md:relative md:translate-x-0 md:flex shadow-xl md:shadow-none">
    
    <!-- Top Section (Logo & Links) -->
    <div class="flex flex-col h-full overflow-hidden">
      <!-- Company Logo / Title -->
      <div class="h-16 flex items-center justify-between px-6 border-b border-gray-200 shrink-0">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow-sm">E</div>
          <div>
            <div class="text-lg font-bold text-gray-900 leading-tight">ESMS</div>
            <div class="text-[11px] font-medium text-gray-500">Mega Supply</div>
          </div>
        </div>
        
        <!-- Mobile Close Button (X) -->
        <label for="sidebar-toggle" class="md:hidden p-1.5 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 cursor-pointer transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </label>
      </div>

      <!-- Navigation Links -->
      <nav class="p-4 space-y-1.5 overflow-y-auto flex-1">
        
        <!-- Section: Overview -->
        <p class="px-3 text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2 mt-2">Overview</p>
        <a routerLink="/dashboard" routerLinkActive="bg-blue-50 text-blue-600 font-semibold shadow-xs" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-3 px-3 py-2.5 text-sm text-gray-600 rounded-lg hover:bg-gray-100 hover:text-gray-900 transition-all">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
          Dashboard
        </a>

        <!-- Section: Management -->
        <p class="px-3 text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2 mt-6">Management</p>
        <a routerLink="/users" routerLinkActive="bg-blue-50 text-blue-600 font-semibold shadow-xs" class="flex items-center gap-3 px-3 py-2.5 text-sm text-gray-600 rounded-lg hover:bg-gray-100 hover:text-gray-900 transition-all">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          Users
        </a>
        <a routerLink="/attendance" routerLinkActive="bg-blue-50 text-blue-600 font-semibold shadow-xs" class="flex items-center gap-3 px-3 py-2.5 text-sm text-gray-600 rounded-lg hover:bg-gray-100 hover:text-gray-900 transition-all">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          Attendance
        </a>
        <a routerLink="/leave" routerLinkActive="bg-blue-50 text-blue-600 font-semibold shadow-xs" class="flex items-center gap-3 px-3 py-2.5 text-sm text-gray-600 rounded-lg hover:bg-gray-100 hover:text-gray-900 transition-all">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          Leave Requests
        </a>

        <!-- Section: Payroll -->
        <p class="px-3 text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2 mt-6">Payroll</p>
        <a routerLink="/salary" routerLinkActive="bg-blue-50 text-blue-600 font-semibold shadow-xs" class="flex items-center gap-3 px-3 py-2.5 text-sm text-gray-600 rounded-lg hover:bg-gray-100 hover:text-gray-900 transition-all">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          Salary & Payslips
        </a>
      </nav>
    </div>

    <!-- Bottom Section (User Profile) -->
    <div class="p-4 border-t border-gray-200 shrink-0 bg-white">
      <div class="flex items-center justify-between px-2 py-2 hover:bg-gray-50 rounded-lg cursor-pointer transition-colors">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm">
            U
          </div>
          <div>
            <p class="text-sm font-semibold text-gray-800">User</p>
            <p class="text-xs text-gray-500">Owner</p>
          </div>
        </div>
        <svg class="w-5 h-5 text-gray-400 hover:text-red-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
      </div>
    </div>
  </aside>

  <!-- ================= MAIN CONTENT AREA ================= -->
  <div class="flex-1 flex flex-col overflow-hidden min-w-0">
    
    <!-- Top Navbar -->
    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 sm:px-8 z-10 shrink-0">
      <div class="flex items-center gap-3">
        <!-- Hamburger Menu Toggle Button (Visible only on mobile/tablet below md) -->
        <label for="sidebar-toggle" class="md:hidden p-2 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-gray-900 cursor-pointer transition-colors focus:outline-hidden">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </label>

        <!-- Page Title -->
        <h1 class="text-lg sm:text-xl font-bold text-gray-800 truncate">
          {{ pageTitleService.title | async }}
        </h1>
      </div>
        
      <!-- Date Display -->
      <div class="text-sm text-gray-500 hidden sm:block">
        <!-- {{ currentDate | date:'EEEE, dd MMMM yyyy' }} -->
      </div>
    </header>

    <!-- Dynamic Content Renderer -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-4 sm:p-8">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
