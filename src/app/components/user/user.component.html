<div class="min-h-screen bg-gray-100 p-6">
  
  <!-- Top Header -->
  <div class="bg-blue-600 text-white p-4 rounded-xl shadow mb-6">
    <h1 class="text-xl font-bold">Mega Supply (PVT) LTD</h1>
    <p class="text-sm opacity-90">Employee Self-Service Portal</p>
  </div>

  <!-- Navigation Buttons (Tabs) -->
  <div class="flex gap-4 mb-6">
    <button (click)="selectedTab = 'attendance'" 
      [class]="selectedTab === 'attendance' ? 'bg-blue-600 text-white' : 'bg-white text-gray-700'"
      class="px-4 py-2 rounded-lg font-semibold shadow">
      Daily Attendance
    </button>
    <button (click)="selectedTab = 'salary'" 
      [class]="selectedTab === 'salary' ? 'bg-blue-600 text-white' : 'bg-white text-gray-700'"
      class="px-4 py-2 rounded-lg font-semibold shadow">
      Salary & Payslips
    </button>
  </div>

  <!-- TAB 1: Attendance Section -->
  <div *ngIf="selectedTab === 'attendance'" class="bg-white p-6 rounded-xl shadow max-w-md mx-auto">
    <h2 class="text-lg font-bold mb-2 text-gray-800">Mark Attendance</h2>
    <p class="text-xs text-gray-500 mb-4">Record your daily check-in and check-out times[cite: 7].</p>

    <!-- Success / Error Message -->
    <div *ngIf="feedbackMessage" class="mb-4 p-2 bg-green-100 text-green-700 text-sm rounded">
      {{ feedbackMessage }}
    </div>

    <div class="space-y-4">
      <!-- Check-In Button -->
      <button (click)="checkIn()" 
        [disabled]="todayRecord?.checkInTime"
        class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 disabled:opacity-50">
        {{ todayRecord?.checkInTime ? 'Checked In at ' + todayRecord.checkInTime : 'Click to Check In' }}
      </button>

      <!-- Check-Out Button -->
      <button (click)="checkOut()" 
        [disabled]="!todayRecord?.checkInTime || todayRecord?.checkOutTime"
        class="w-full bg-amber-600 text-white py-3 rounded-lg font-semibold hover:bg-amber-700 disabled:opacity-50">
        {{ todayRecord?.checkOutTime ? 'Checked Out at ' + todayRecord.checkOutTime : 'Click to Check Out' }}
      </button>
    </div>
  </div>

  <!-- TAB 2: Salary History Section -->
  <div *ngIf="selectedTab === 'salary'" class="max-w-xl mx-auto space-y-4">
    <h2 class="text-lg font-bold text-gray-800">My Salary History</h2>

    <div *ngFor="let item of salaryList" class="bg-white p-4 rounded-xl shadow flex justify-between items-center">
      <div>
        <p class="font-bold text-gray-800">{{ item.month }} {{ item.year }}</p>
        <p class="text-sm text-gray-500">Net Salary: LKR {{ item.netSalary }}</p>
      </div>
      <button class="bg-blue-50 text-blue-600 border border-blue-600 px-3 py-1.5 text-xs font-semibold rounded hover:bg-blue-100">
        Download PDF[cite: 8]
      </button>
    </div>
  </div>

</div>
