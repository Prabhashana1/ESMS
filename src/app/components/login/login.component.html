<!-- Background and Centering -->
<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  
  <!-- Login Card container -->
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-gray-800">ESMS</h2>
      <p class="text-gray-500 mt-2">Employee Salary Management System</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <!-- Username Field -->
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">Username</label>
        <input 
          type="text" 
          formControlName="username" 
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your username">
        
        <!-- Frontend Validation Alert -->
        <span class="text-red-500 text-xs mt-1 block" 
              *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
          Username is required.
        </span>
      </div>

      <!-- Password Field -->
      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
        <input 
          type="password" 
          formControlName="password" 
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your password">
        
        <!-- Frontend Validation Alert -->
        <span class="text-red-500 text-xs mt-1 block" 
              *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password is required.
        </span>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        [disabled]="loginForm.invalid || isLoading" 
        class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 disabled:bg-blue-300 disabled:cursor-not-allowed transition duration-200 flex items-center justify-center gap-2">
        
        <!-- Not Loading State -->
        <span *ngIf="!isLoading">Sign In</span>
        
        <!-- Loading State (Spinner + Text) -->
        <span *ngIf="isLoading" class="flex items-center gap-2">
          <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Please wait...
        </span>

      </button>

    </form>
  </div>
</div>
