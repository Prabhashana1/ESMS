<!-- Background and Centering -->
<div class="min-h-screen bg-gray-100 flex">
  <!-- sidebar -->
  <div class="max-w-1/6 md:flex hidden bg-blue-800 h-screen">
    <div class="w-full p-4 justify-end">
      <div class="ms-60">
        <div
          class="bg-white max-h-10 max-w-10 text-center rounded-full p-2 cursor-pointer"
        >
          <i class="fa-solid fa-arrow-left"></i>
        </div>
      </div>
      <div
        class="h-56 w-full flex flex-col items-center justify-center gap-3 my-20 text-white text-ellipsis text-base"
      >
        <a
          class="rounded-xl w-full py-3 hover:bg-blue-700 flex items-center justify-center gap-2"
          href="#"
        >
          <i class="fa-solid fa-house-chimney"></i> Home
        </a>
        <a
          class="rounded-xl w-full py-3 hover:bg-blue-700 flex items-center justify-center gap-2"
          href="#"
        >
          <i class="fa-solid fa-bars"></i> Menu</a
        >
        <a
          class="rounded-xl w-full py-3 hover:bg-blue-700 flex justify-center items-center gap-4"
          href="#"
        >
          <i class="fa-solid fa-users"></i> <span>Employees</span></a
        >
        <a
          class="rounded-xl w-full py-3 hover:bg-blue-700 flex items-center justify-center gap-2"
          href="#"
          ><i class="fa-solid fa-user-tie"></i> Managers</a
        >
        <a
          class="rounded-xl w-full py-3 hover:bg-blue-700 flex items-center justify-center gap-2"
          href="#"
        >
          <i class="fa-solid fa-receipt"></i>Payslips</a
        >
      </div>

      <div class="flex w-full justify-center h-80 items-end text-base">
        <div
          class="w-full h-20 border border-b-0 text-white border-l-0 border-r-0 border-t-1"
        >
          <a
            class="rounded-xl w-full py-3 mt-5 hover:bg-blue-700 flex items-center justify-center gap-2"
            href="#"
            ><i class="fa-solid fa-right-from-bracket"></i>Logout</a
          >
        </div>
      </div>
    </div>
  </div>

  <!-- hero section -->
  <div class="w-full">
    <!-- search bar div  -->
    <div class="w-full h-16 bg-gray-200  justify-between items-center md:flex hidden">
      <div
        id="search-bar"
        class="h-10 w-72 ms-10 flex justify-center items-center gap-2"
      >
        <!-- <i class="fa-brands fa-searchengin w-10 h-5"></i> -->
        <input
          type="text"
          name="search"
          id=""
          class="rounded-2xl p-4 border border-gray-500 w-full h-10 focus:ring-blue-400"
          placeholder=" 🔍 Search "
        />
      </div>
      <div
        id=""
        class="border h-10 w-1/5 me-10 text-xl flex justify-around items-center"
      >
        <i class="fa-solid fa-moon"></i>
        <i class="fa-solid fa-circle-user"></i>
        <span>V 1.16</span>
        <i class="fa-solid fa-gear"></i>
      </div>
    </div>
    
    <!-- cards  -->

    <div class="h-60 w-full flex flex-col md:flex-row gap-3 justify-around items-center">
      <div class="w-1/4 h-40 shadow-md border-b-8 border-blue-500 rounded-2xl">
        <div class="bg-gray-200 p-2 rounded-t-2xl text-center">
          <span class="text-xl font-semibold">Total Employees</span>
        </div>
        <div class="h-28">
          <div class="p-3 gap-3 flex justify-start items-center">
            <i class="fa-solid fa-users text-gray-500 text-4xl"></i>
            <span class="text-blue-400 text-6xl">0</span>
          </div>
          <div class="ps-5">
            <span class="italic">Trend vs Employees</span>
          </div>
        </div>
      </div>
      <div class="w-1/4 h-40 shadow-md border-b-8 border-green-400 rounded-2xl">
        <div class="bg-gray-200 p-2 rounded-t-2xl text-center">
          <span class="text-xl font-semibold">Today Attendance</span>
        </div>
        <div class="h-28">
          <div class="p-3 gap-3 flex justify-start items-center">
            <i class="fa-solid fa-user-clock text-gray-500 text-4xl"></i>
            <span class="text-blue-400 text-6xl">0 </span>
          </div>
          <div class="ps-5">
            <span class="italic">Trend vs Employees</span>
          </div>
        </div>
      </div>
      <div
        class="w-1/4 h-40 shadow-md border-b-8 border-yellow-300 rounded-2xl"
      >
        <div class="bg-gray-200 p-2 rounded-t-2xl text-center">
          <span class="text-xl font-semibold">Payroll Total</span>
        </div>
        <div class="h-28">
          <div class="p-3 gap-3 flex justify-start items-center">
            <i class="fa-solid fa-coins text-gray-500 text-4xl"></i>
            <span class="text-blue-400 text-6xl">0</span>
          </div>
          <div class="ps-5">
            <span class="italic">Trend vs Employees</span>
          </div>
        </div>
      </div>
    </div>

    <!-- charts  -->
    <div class="h-1/2 w-full flex flex-col md:flex-row justify-evenly items-center">

      <!-- bar chart  -->
      <div class="w-1/3 h-52 shadow-md rounded-2xl mb-16">
        <div class="bg-white p-6 rounded-xl shadow border border-gray-200">
          <h3 class="text-lg font-semibold mb-6 text-gray-700">
            Weekly Attendance
          </h3>

          <!-- Chart Container -->
          <div class="flex items-end justify-between h-24 gap-2">
            <div
              class="w-full bg-blue-200 hover:bg-blue-600 transition-colors h-[40%] rounded-t-md"
            ></div>
            <div
              class="w-full bg-blue-200 hover:bg-blue-600 transition-colors h-[75%] rounded-t-md"
            ></div>
            <div class="w-full bg-blue-600 h-[100%] rounded-t-md"></div>
            <!-- Active/Highest -->
            <div
              class="w-full bg-blue-200 hover:bg-blue-600 transition-colors h-[60%] rounded-t-md"
            ></div>
            <div
              class="w-full bg-blue-200 hover:bg-blue-600 transition-colors h-[85%] rounded-t-md"
            ></div>
          </div>

          <!-- X-Axis Labels -->
          <div
            class="flex justify-between text-xs text-gray-500 mt-3 font-medium"
          >
            <span class="w-full text-center">Mon</span>
            <span class="w-full text-center">Tue</span>
            <span class="w-full text-center">Wed</span>
            <span class="w-full text-center">Thu</span>
            <span class="w-full text-center">Fri</span>
          </div>
        </div>
      </div>
      <!-- pie chart  -->
      <div class="w-1/3 h-52 shadow-md rounded-2xl mb-16">
        <!-- Pie Chart Widget -->
        <div
          class="bg-white p-6 rounded-xl shadow border border-gray-200 flex flex-col items-center"
        >
          <h3 class="text-lg font-semibold text-gray-700 w-full text-left">
            Employee Roles
          </h3>

          <!-- Pie Chart (Conic Gradient) -->
          <div
            class="w-24 h-24 rounded-full shadow-inner bg-[conic-gradient(#3b82f6_0_45%,#10b981_45%_80%,#f59e0b_80%_100%)]"
          ></div>

          <!-- Legend -->
          <div class="flex gap-4 mt-8 text-sm text-gray-600 font-medium">
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full bg-[#3b82f6]"></span> Sales
            </div>
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full bg-[#10b981]"></span> Tech
            </div>
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full bg-[#f59e0b]"></span> Admin
            </div>
          </div>
        </div>
      </div>

    </div>
    <div class="h-20 w-full flex justify-around items-center"></div>
  </div>
</div>
